services:
  postgres:
    image: postgres:16-alpine
    container_name: inknote-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inknote
      POSTGRES_USER: inknote
      POSTGRES_PASSWORD: inknote
    volumes:
      - inknote_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inknote -d inknote"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inknote_pg_data:
